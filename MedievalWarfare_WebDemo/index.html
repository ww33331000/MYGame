<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中世纪战争 - Medieval Warfare</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Cinzel', 'Times New Roman', serif; background: #1a1a2e; }
#gameCanvas { display: block; }

.menu-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.5s;
}
.menu-screen.hidden { opacity: 0; pointer-events: none; }

.game-title {
    font-size: 64px; color: #e94560; text-shadow: 0 0 20px rgba(233,69,96,0.5), 4px 4px 8px rgba(0,0,0,0.8);
    margin-bottom: 10px; letter-spacing: 8px; font-weight: bold;
}
.game-subtitle {
    font-size: 24px; color: #a0a0a0; margin-bottom: 50px; letter-spacing: 4px;
}

.menu-btn {
    padding: 16px 60px; margin: 10px;
    font-size: 20px; font-family: inherit;
    background: linear-gradient(180deg, #e94560 0%, #c73650 100%);
    color: white; border: 2px solid #ff6b6b; border-radius: 4px;
    cursor: pointer; transition: all 0.2s; letter-spacing: 2px;
    box-shadow: 0 4px 15px rgba(233,69,96,0.4);
}
.menu-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,0.6); }
.menu-btn:active { transform: translateY(0); }
.menu-btn.secondary {
    background: linear-gradient(180deg, #533483 0%, #3d2566 100%);
    border-color: #7b5aad;
    box-shadow: 0 4px 15px rgba(83,52,131,0.4);
}

.hud {
    position: fixed; top: 0; left: 0; width: 100%; padding: 20px;
    display: none; justify-content: space-between; align-items: flex-start;
    z-index: 50; pointer-events: none;
}
.hud.active { display: flex; }

.health-bar-container {
    background: rgba(0,0,0,0.7); border: 2px solid #e94560; border-radius: 4px;
    padding: 8px 15px; min-width: 250px;
}
.health-label { color: #fff; font-size: 14px; margin-bottom: 5px; letter-spacing: 1px; }
.health-bar { width: 100%; height: 20px; background: #2d2d2d; border-radius: 2px; overflow: hidden; }
.health-fill { height: 100%; background: linear-gradient(90deg, #e94560, #ff6b6b); transition: width 0.3s; }

.enemy-counter {
    background: rgba(0,0,0,0.7); border: 2px solid #533483; border-radius: 4px;
    padding: 10px 20px; color: #fff; font-size: 16px; letter-spacing: 1px;
}

.controls-hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 4px;
    color: #aaa; font-size: 14px; letter-spacing: 1px; z-index: 50;
    display: none;
}
.controls-hint.active { display: block; }

.world-map-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #2c3e50 0%, #34495e 50%, #5d6d7e 100%);
    display: none; flex-direction: column; z-index: 90;
}
.world-map-screen.active { display: flex; }

.map-header {
    padding: 20px 40px; background: rgba(0,0,0,0.5);
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #e94560;
}
.map-title { color: #e94560; font-size: 28px; letter-spacing: 4px; }

.map-container {
    flex: 1; position: relative; overflow: hidden;
    background:
        radial-gradient(ellipse at 30% 40%, rgba(46, 139, 87, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(139, 90, 43, 0.3) 0%, transparent 50%),
        linear-gradient(180deg, #87CEEB 0%, #98D8C8 30%, #90EE90 60%, #8B4513 100%);
}

.map-node {
    position: absolute; width: 50px; height: 50px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s; z-index: 10;
    border: 3px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    font-size: 20px;
}
.map-node.village { background: #2ecc71; }
.map-node.castle { background: #e74c3c; }
.map-node.forest { background: #27ae60; }
.map-node.current { box-shadow: 0 0 0 5px rgba(233,69,96,0.5), 0 4px 15px rgba(0,0,0,0.5); transform: scale(1.2); }
.map-node:hover { transform: scale(1.15); }

.map-node-label {
    position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
    white-space: nowrap; color: #fff; font-size: 12px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8); letter-spacing: 1px;
}

.node-info-panel {
    position: absolute; top: 80px; right: 30px;
    background: rgba(0,0,0,0.85); border: 2px solid #e94560;
    border-radius: 8px; padding: 20px; min-width: 280px;
    color: #fff; z-index: 20;
}
.node-info-title { font-size: 20px; color: #e94560; margin-bottom: 10px; letter-spacing: 2px; }
.node-info-desc { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 15px; }
.node-info-btn {
    padding: 10px 25px; background: linear-gradient(180deg, #e94560, #c73650);
    color: white; border: none; border-radius: 4px; cursor: pointer;
    font-family: inherit; font-size: 14px; letter-spacing: 1px;
}
.node-info-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.node-info-btn.back-btn {
    background: linear-gradient(180deg, #533483, #3d2566); margin-right: 10px;
}

.travel-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); display: none;
    align-items: center; justify-content: center; z-index: 95;
}
.travel-overlay.active { display: flex; flex-direction: column; }
.travel-text { color: #e94560; font-size: 32px; letter-spacing: 4px; margin-bottom: 20px; }
.travel-progress { width: 300px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
.travel-progress-fill { height: 100%; background: #e94560; width: 0%; transition: width 0.1s linear; }

.result-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); display: none;
    flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
}
.result-screen.active { display: flex; }
.result-title { font-size: 72px; margin-bottom: 20px; letter-spacing: 8px; }
.result-title.victory { color: #2ecc71; text-shadow: 0 0 30px rgba(46,204,113,0.5); }
.result-title.defeat { color: #e94560; text-shadow: 0 0 30px rgba(233,69,96,0.5); }
.result-desc { color: #aaa; font-size: 20px; margin-bottom: 40px; letter-spacing: 2px; }

.crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; pointer-events: none; z-index: 40;
    display: none;
}
.crosshair.active { display: block; }
.crosshair::before, .crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.7);
}
.crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
.crosshair::after { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }

.quest-info {
    color: #aaa; font-size: 14px; letter-spacing: 1px;
}
</style>
</head>
<body>

<!-- 主菜单 -->
<div id="mainMenu" class="menu-screen">
    <h1 class="game-title">中世纪战争</h1>
    <p class="game-subtitle">MEDIEVAL WARFARE</p>
    <button class="menu-btn" onclick="startGame()">开始游戏</button>
    <button class="menu-btn secondary" onclick="showControls()">操作说明</button>
</div>

<!-- 大地图 -->
<div id="worldMapScreen" class="world-map-screen">
    <div class="map-header">
        <div class="map-title">大地图</div>
        <div class="quest-info">击败所有敌人，统一大陆</div>
    </div>
    <div id="mapContainer" class="map-container">
        <div id="nodeInfoPanel" class="node-info-panel" style="display:none;">
            <div id="nodeInfoTitle" class="node-info-title"></div>
            <div id="nodeInfoDesc" class="node-info-desc"></div>
            <button id="nodeActionBtn" class="node-info-btn">前往此地</button>
        </div>
    </div>
</div>

<!-- 旅行动画 -->
<div id="travelOverlay" class="travel-overlay">
    <div class="travel-text">正在前往目的地...</div>
    <div class="travel-progress"><div id="travelProgress" class="travel-progress-fill"></div></div>
</div>

<!-- HUD -->
<div id="battleHUD" class="hud">
    <div class="health-bar-container">
        <div class="health-label">玩家生命值</div>
        <div class="health-bar"><div id="playerHealthFill" class="health-fill" style="width:100%"></div></div>
    </div>
    <div class="enemy-counter">剩余敌人: <span id="enemyCount">3</span></div>
</div>

<div id="crosshair" class="crosshair"></div>

<div id="controlsHint" class="controls-hint">
    WASD 移动 | 鼠标左键 攻击 | 鼠标右键 防御 | Shift 奔跑 | 空格 跳跃 | Esc 暂停
</div>

<!-- 结算界面 -->
<div id="resultScreen" class="result-screen">
    <div id="resultTitle" class="result-title victory">胜利！</div>
    <div id="resultDesc" class="result-desc">你击败了所有敌人</div>
    <button class="menu-btn" onclick="returnToMap()">返回大地图</button>
    <button class="menu-btn secondary" onclick="returnToMenu()">返回主菜单</button>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ========== 游戏状态 ==========
const GameState = { MENU: 'menu', WORLD_MAP: 'worldMap', BATTLE: 'battle', RESULT: 'result' };
let currentState = GameState.MENU;

// ========== 玩家数据 ==========
const player = {
    maxHealth: 100,
    health: 100,
    attack: 20,
    defense: 5,
    speed: 8,
    isAttacking: false,
    isBlocking: false,
    attackCooldown: 0,
    position: { x: 0, z: 0 }
};

// ========== 大地图数据 ==========
const mapNodes = [
    { id: 0, name: '起始村庄', type: 'village', icon: '🏠', x: 15, y: 60, desc: '一个宁静的小村庄，你的冒险从这里开始。', enemies: 0, connected: [1, 2] },
    { id: 1, name: '黑暗森林', type: 'forest', icon: '🌲', x: 35, y: 35, desc: '茂密的森林中潜伏着土匪，小心行事。', enemies: 2, connected: [0, 3] },
    { id: 2, name: '边境哨站', type: 'castle', icon: '🏰', x: 40, y: 75, desc: '废弃的边境哨站，被强盗占据。', enemies: 3, connected: [0, 4] },
    { id: 3, name: '强盗营地', type: 'castle', icon: '⚔️', x: 60, y: 25, desc: '强盗的主要据点，守卫森严。', enemies: 4, connected: [1, 5] },
    { id: 4, name: '古老遗迹', type: 'forest', icon: '🏛️', x: 65, y: 65, desc: '神秘的古老遗迹，据说有宝藏。', enemies: 3, connected: [2, 5] },
    { id: 5, name: '领主城堡', type: 'castle', icon: '👑', x: 85, y: 45, desc: '最终目标——邪恶领主的城堡。', enemies: 5, connected: [3, 4], isBoss: true }
];
let currentNodeId = 0;
let selectedNodeId = null;

// ========== Three.js 变量 ==========
let scene, camera, renderer, clock;
let playerMesh, playerSword, playerShield;
let enemies = [];
let keys = {};
let mouseX = 0, mouseY = 0;
let cameraAngleX = 0, cameraAngleY = 0.5;
let cameraDistance = 12;
let isPointerLocked = false;
let attackTimer = 0;
let gameLoopId = null;

// ========== 初始化大地图 ==========
function initWorldMap() {
    const container = document.getElementById('mapContainer');
    mapNodes.forEach(node => {
        const el = document.createElement('div');
        el.className = `map-node ${node.type}`;
        el.style.left = node.x + '%';
        el.style.top = node.y + '%';
        el.innerHTML = node.icon;
        el.id = `node-${node.id}`;
        el.onclick = () => selectNode(node.id);
        const label = document.createElement('div');
        label.className = 'map-node-label';
        label.textContent = node.name;
        el.appendChild(label);
        container.appendChild(el);
    });
    updateCurrentNode();
}

function updateCurrentNode() {
    mapNodes.forEach(n => {
        const el = document.getElementById(`node-${n.id}`);
        if (el) el.classList.toggle('current', n.id === currentNodeId);
    });
}

function selectNode(id) {
    selectedNodeId = id;
    const node = mapNodes[id];
    const panel = document.getElementById('nodeInfoPanel');
    const title = document.getElementById('nodeInfoTitle');
    const desc = document.getElementById('nodeInfoDesc');
    const btn = document.getElementById('nodeActionBtn');

    title.textContent = node.name;
    let descText = node.desc;
    if (node.enemies > 0) descText += `\n\n敌人数量: ${node.enemies}`;
    desc.innerText = descText;

    const currentNode = mapNodes[currentNodeId];
    const isConnected = currentNode.connected.includes(id);
    const isCurrent = id === currentNodeId;

    if (isCurrent) {
        if (node.enemies > 0) {
            btn.textContent = '发起进攻';
            btn.disabled = false;
            btn.onclick = () => startBattle(id);
        } else {
            btn.textContent = '已探索';
            btn.disabled = true;
        }
    } else if (isConnected) {
        btn.textContent = '前往此地';
        btn.disabled = false;
        btn.onclick = () => travelTo(id);
    } else {
        btn.textContent = '无法直接到达';
        btn.disabled = true;
    }
    panel.style.display = 'block';
}

function travelTo(id) {
    const overlay = document.getElementById('travelOverlay');
    const progress = document.getElementById('travelProgress');
    overlay.classList.add('active');
    let p = 0;
    const interval = setInterval(() => {
        p += 2;
        progress.style.width = p + '%';
        if (p >= 100) {
            clearInterval(interval);
            overlay.classList.remove('active');
            currentNodeId = id;
            updateCurrentNode();
            selectNode(id);
        }
    }, 30);
}

// ========== 场景切换 ==========
function startGame() {
    document.getElementById('mainMenu').classList.add('hidden');
    currentState = GameState.WORLD_MAP;
    document.getElementById('worldMapScreen').classList.add('active');
    initWorldMap();
}

function showControls() {
    alert('操作说明：\n\n' +
          'WASD / 方向键 - 移动\n' +
          '鼠标移动 - 视角\n' +
          '鼠标左键 - 攻击\n' +
          '鼠标右键 - 防御\n' +
          'Shift - 奔跑\n' +
          '空格 - 跳跃\n' +
          'Esc - 暂停/退出');
}

function startBattle(nodeId) {
    document.getElementById('worldMapScreen').classList.remove('active');
    document.getElementById('nodeInfoPanel').style.display = 'none';
    currentState = GameState.BATTLE;
    player.health = player.maxHealth;
    document.getElementById('battleHUD').classList.add('active');
    document.getElementById('controlsHint').classList.add('active');
    document.getElementById('crosshair').classList.add('active');
    initBattleScene(mapNodes[nodeId].enemies);
}

function returnToMap() {
    document.getElementById('resultScreen').classList.remove('active');
    document.getElementById('battleHUD').classList.remove('active');
    document.getElementById('controlsHint').classList.remove('active');
    document.getElementById('crosshair').classList.remove('active');
    if (gameLoopId) cancelAnimationFrame(gameLoopId);
    if (renderer) {
        renderer.dispose();
        document.body.removeChild(renderer.domElement);
    }
    enemies = [];
    currentState = GameState.WORLD_MAP;
    document.getElementById('worldMapScreen').classList.add('active');
    updateCurrentNode();
}

function returnToMenu() {
    document.getElementById('resultScreen').classList.remove('active');
    document.getElementById('battleHUD').classList.remove('active');
    document.getElementById('controlsHint').classList.remove('active');
    document.getElementById('crosshair').classList.remove('active');
    document.getElementById('worldMapScreen').classList.remove('active');
    document.getElementById('nodeInfoPanel').style.display = 'none';
    if (gameLoopId) cancelAnimationFrame(gameLoopId);
    if (renderer) {
        renderer.dispose();
        document.body.removeChild(renderer.domElement);
    }
    enemies = [];
    currentState = GameState.MENU;
    document.getElementById('mainMenu').classList.remove('hidden');
}

function showResult(victory) {
    currentState = GameState.RESULT;
    document.getElementById('resultScreen').classList.add('active');
    const title = document.getElementById('resultTitle');
    const desc = document.getElementById('resultDesc');
    if (victory) {
        title.textContent = '胜利！';
        title.className = 'result-title victory';
        desc.textContent = '你击败了所有敌人！';
        const node = mapNodes[currentNodeId];
        node.enemies = 0;
    } else {
        title.textContent = '战败...';
        title.className = 'result-title defeat';
        desc.textContent = '你被敌人击败了，再接再厉！';
    }
}

// ========== Three.js 战斗场景 ==========
function initBattleScene(enemyCount) {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 30, 80);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    // 光照
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 30, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    scene.add(dirLight);

    // 地面
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4a7c3a });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 地形装饰
    addTerrainDecorations();

    // 玩家
    createPlayer();

    // 敌人
    for (let i = 0; i < enemyCount; i++) {
        const angle = (i / enemyCount) * Math.PI * 2;
        const dist = 15 + Math.random() * 5;
        createEnemy(Math.cos(angle) * dist, Math.sin(angle) * dist);
    }

    updateEnemyCount();

    // 事件监听
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('resize', onResize);
    renderer.domElement.addEventListener('click', () => {
        if (currentState === GameState.BATTLE) {
            renderer.domElement.requestPointerLock();
        }
    });
    document.addEventListener('pointerlockchange', () => {
        isPointerLocked = document.pointerLockElement === renderer.domElement;
    });
    document.addEventListener('keydown', e => {
        if (e.code === 'Escape' && currentState === GameState.BATTLE) {
            if (isPointerLocked) document.exitPointerLock();
        }
    });

    animate();
}

function addTerrainDecorations() {
    // 树
    for (let i = 0; i < 20; i++) {
        const x = (Math.random() - 0.5) * 80;
        const z = (Math.random() - 0.5) * 80;
        if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;
        createTree(x, z);
    }
    // 石头
    for (let i = 0; i < 10; i++) {
        const x = (Math.random() - 0.5) * 70;
        const z = (Math.random() - 0.5) * 70;
        if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
        createRock(x, z);
    }
}

function createTree(x, z) {
    const tree = new THREE.Group();
    const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 3, 8);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 1.5;
    trunk.castShadow = true;
    tree.add(trunk);

    const leafGeo = new THREE.ConeGeometry(2, 4, 8);
    const leafMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
    const leaves = new THREE.Mesh(leafGeo, leafMat);
    leaves.position.y = 4.5;
    leaves.castShadow = true;
    tree.add(leaves);

    tree.position.set(x, 0, z);
    tree.scale.setScalar(0.8 + Math.random() * 0.6);
    scene.add(tree);
}

function createRock(x, z) {
    const geo = new THREE.DodecahedronGeometry(0.8 + Math.random() * 0.8, 0);
    const mat = new THREE.MeshLambertMaterial({ color: 0x696969 });
    const rock = new THREE.Mesh(geo, mat);
    rock.position.set(x, 0.3, z);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    scene.add(rock);
}

function createPlayer() {
    playerMesh = new THREE.Group();

    // 身体
    const bodyGeo = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    playerMesh.add(body);

    // 头
    const headGeo = new THREE.SphereGeometry(0.35, 12, 12);
    const headMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.2;
    head.castShadow = true;
    playerMesh.add(head);

    // 头盔
    const helmetGeo = new THREE.SphereGeometry(0.38, 12, 12, 0, Math.PI * 2, 0, Math.PI / 2);
    const helmetMat = new THREE.MeshLambertMaterial({ color: 0x808080 });
    const helmet = new THREE.Mesh(helmetGeo, helmetMat);
    helmet.position.y = 2.2;
    helmet.castShadow = true;
    playerMesh.add(helmet);

    // 剑
    playerSword = new THREE.Group();
    const bladeGeo = new THREE.BoxGeometry(0.08, 1.2, 0.04);
    const bladeMat = new THREE.MeshLambertMaterial({ color: 0xc0c0c0 });
    const blade = new THREE.Mesh(bladeGeo, bladeMat);
    blade.position.y = 0.6;
    blade.castShadow = true;
    playerSword.add(blade);
    const handleGeo = new THREE.BoxGeometry(0.1, 0.25, 0.1);
    const handleMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const handle = new THREE.Mesh(handleGeo, handleMat);
    handle.castShadow = true;
    playerSword.add(handle);
    playerSword.position.set(0.6, 1.4, 0.2);
    playerSword.rotation.z = -0.3;
    playerMesh.add(playerSword);

    // 盾
    playerShield = new THREE.Group();
    const shieldGeo = new THREE.BoxGeometry(0.5, 0.8, 0.08);
    const shieldMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const shield = new THREE.Mesh(shieldGeo, shieldMat);
    shield.castShadow = true;
    playerShield.add(shield);
    const bossGeo = new THREE.CircleGeometry(0.1, 16);
    const bossMat = new THREE.MeshLambertMaterial({ color: 0xffd700, side: THREE.DoubleSide });
    const boss = new THREE.Mesh(bossGeo, bossMat);
    boss.position.z = 0.05;
    playerShield.add(boss);
    playerShield.position.set(-0.55, 1.4, 0.2);
    playerShield.rotation.y = 0.3;
    playerMesh.add(playerShield);

    playerMesh.position.set(0, 0, 0);
    scene.add(playerMesh);
    player.position.x = 0;
    player.position.z = 0;
}

function createEnemy(x, z) {
    const enemy = {
        mesh: new THREE.Group(),
        health: 60,
        maxHealth: 60,
        speed: 3,
        attack: 15,
        state: 'idle',
        stateTimer: 0,
        attackCooldown: 0,
        healthBar: null,
        isDead: false
    };

    // 身体
    const bodyGeo = new THREE.CapsuleGeometry(0.35, 1, 4, 8);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8B0000 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1;
    body.castShadow = true;
    enemy.mesh.add(body);

    // 头
    const headGeo = new THREE.SphereGeometry(0.3, 10, 10);
    const headMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.8;
    head.castShadow = true;
    enemy.mesh.add(head);

    // 武器（斧头）
    const axe = new THREE.Group();
    const handleGeo = new THREE.CylinderGeometry(0.04, 0.04, 1, 8);
    const handleMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const axeHandle = new THREE.Mesh(handleGeo, handleMat);
    axeHandle.castShadow = true;
    axe.add(axeHandle);
    const axeHeadGeo = new THREE.BoxGeometry(0.3, 0.2, 0.05);
    const axeHeadMat = new THREE.MeshLambertMaterial({ color: 0x808080 });
    const axeHead = new THREE.Mesh(axeHeadGeo, axeHeadMat);
    axeHead.position.y = 0.4;
    axeHead.castShadow = true;
    axe.add(axeHead);
    axe.position.set(-0.5, 1.2, 0.2);
    axe.rotation.z = 0.2;
    enemy.mesh.add(axe);

    // 血条
    const healthBarBg = new THREE.Mesh(
        new THREE.PlaneGeometry(1.2, 0.12),
        new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide })
    );
    healthBarBg.position.y = 2.5;
    healthBarBg.name = 'healthBarBg';
    enemy.mesh.add(healthBarBg);

    const healthBar = new THREE.Mesh(
        new THREE.PlaneGeometry(1.2, 0.12),
        new THREE.MeshBasicMaterial({ color: 0xe94560, side: THREE.DoubleSide })
    );
    healthBar.position.y = 2.5;
    healthBar.position.z = 0.01;
    healthBar.name = 'healthBar';
    enemy.mesh.add(healthBar);
    enemy.healthBar = healthBar;

    enemy.mesh.position.set(x, 0, z);
    scene.add(enemy.mesh);
    enemies.push(enemy);
}

function onMouseMove(e) {
    if (!isPointerLocked) return;
    cameraAngleX -= e.movementX * 0.002;
    cameraAngleY -= e.movementY * 0.002;
    cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2.2, cameraAngleY));
}

function onMouseDown(e) {
    if (currentState !== GameState.BATTLE) return;
    if (e.button === 0 && player.attackCooldown <= 0 && !player.isAttacking) {
        playerAttack();
    } else if (e.button === 1 || e.button === 2) {
        player.isBlocking = true;
    }
}

function onMouseUp(e) {
    if (e.button === 1 || e.button === 2) {
        player.isBlocking = false;
    }
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function playerAttack() {
    player.isAttacking = true;
    player.attackCooldown = 0.6;
    attackTimer = 0.3;

    // 剑挥下动画
    playerSword.rotation.x = -1.2;

    // 检测攻击范围内的敌人
    const attackRange = 2.5;
    const attackAngle = Math.PI / 3;
    const forward = new THREE.Vector3(
        -Math.sin(cameraAngleX), 0, -Math.cos(cameraAngleX)
    );

    enemies.forEach(enemy => {
        if (enemy.isDead) return;
        const dir = new THREE.Vector3(
            enemy.mesh.position.x - playerMesh.position.x,
            0,
            enemy.mesh.position.z - playerMesh.position.z
        );
        const dist = dir.length();
        if (dist < attackRange) {
            dir.normalize();
            const angle = Math.acos(forward.dot(dir));
            if (angle < attackAngle) {
                dealDamageToEnemy(enemy, player.attack);
            }
        }
    });
}

function dealDamageToEnemy(enemy, damage) {
    enemy.health -= damage;
    if (enemy.healthBar) {
        enemy.healthBar.scale.x = Math.max(0, enemy.health / enemy.maxHealth);
        if (enemy.health < enemy.maxHealth * 0.3) {
            enemy.healthBar.material.color.setHex(0xff0000);
        } else if (enemy.health < enemy.maxHealth * 0.6) {
            enemy.healthBar.material.color.setHex(0xffa500);
        }
    }
    // 受击动画
    enemy.mesh.position.y = 0.1;

    if (enemy.health <= 0) {
        enemy.isDead = true;
        scene.remove(enemy.mesh);
        updateEnemyCount();
        if (enemies.filter(e => !e.isDead).length === 0) {
            setTimeout(() => showResult(true), 500);
        }
    }
}

function damagePlayer(damage) {
    if (player.isBlocking) damage = Math.floor(damage * 0.3);
    player.health -= damage;
    if (player.health <= 0) {
        player.health = 0;
        setTimeout(() => showResult(false), 300);
    }
    document.getElementById('playerHealthFill').style.width =
        (player.health / player.maxHealth * 100) + '%';
}

function updateEnemyCount() {
    const alive = enemies.filter(e => !e.isDead).length;
    document.getElementById('enemyCount').textContent = alive;
}

function animate() {
    if (currentState !== GameState.BATTLE) return;
    gameLoopId = requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);

    updatePlayer(dt);
    updateEnemies(dt);
    updateCamera();

    // 剑恢复动画
    if (attackTimer > 0) {
        attackTimer -= dt;
        if (attackTimer <= 0) {
            player.isAttacking = false;
            playerSword.rotation.x = 0;
        }
    }

    renderer.render(scene, camera);
}

function updatePlayer(dt) {
    if (player.attackCooldown > 0) player.attackCooldown -= dt;

    const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? player.speed * 1.8 : player.speed;
    let moveX = 0, moveZ = 0;

    const forward = new THREE.Vector3(-Math.sin(cameraAngleX), 0, -Math.cos(cameraAngleX));
    const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

    if (keys['KeyW'] || keys['ArrowUp']) { moveX += forward.x; moveZ += forward.z; }
    if (keys['KeyS'] || keys['ArrowDown']) { moveX -= forward.x; moveZ -= forward.z; }
    if (keys['KeyA'] || keys['ArrowLeft']) { moveX -= right.x; moveZ -= right.z; }
    if (keys['KeyD'] || keys['ArrowRight']) { moveX += right.x; moveZ += right.z; }

    const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
    if (len > 0) {
        moveX = moveX / len * speed * dt;
        moveZ = moveZ / len * speed * dt;
        playerMesh.position.x += moveX;
        playerMesh.position.z += moveZ;
        player.position.x = playerMesh.position.x;
        player.position.z = playerMesh.position.z;

        // 角色朝向
        const targetAngle = Math.atan2(moveX, moveZ);
        let angleDiff = targetAngle - playerMesh.rotation.y;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        playerMesh.rotation.y += angleDiff * 0.15;
    }

    // 边界限制
    playerMesh.position.x = Math.max(-40, Math.min(40, playerMesh.position.x));
    playerMesh.position.z = Math.max(-40, Math.min(40, playerMesh.position.z));
}

function updateEnemies(dt) {
    enemies.forEach(enemy => {
        if (enemy.isDead) return;

        // 血条朝向相机
        const hb = enemy.mesh.getObjectByName('healthBar');
        const hbBg = enemy.mesh.getObjectByName('healthBarBg');
        if (hb) hb.lookAt(camera.position);
        if (hbBg) hbBg.lookAt(camera.position);

        // 位置恢复
        if (enemy.mesh.position.y > 0) {
            enemy.mesh.position.y = Math.max(0, enemy.mesh.position.y - dt * 2);
        }

        const dx = playerMesh.position.x - enemy.mesh.position.x;
        const dz = playerMesh.position.z - enemy.mesh.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (enemy.attackCooldown > 0) enemy.attackCooldown -= dt;

        if (dist < 2.5) {
            // 攻击
            if (enemy.attackCooldown <= 0) {
                damagePlayer(enemy.attack);
                enemy.attackCooldown = 1.5;
            }
            // 面向玩家
            enemy.mesh.rotation.y = Math.atan2(dx, dz);
        } else if (dist < 25) {
            // 追击
            const moveSpeed = enemy.speed * dt;
            enemy.mesh.position.x += (dx / dist) * moveSpeed;
            enemy.mesh.position.z += (dz / dist) * moveSpeed;
            enemy.mesh.rotation.y = Math.atan2(dx, dz);
        } else {
            // 巡逻
            enemy.stateTimer -= dt;
            if (enemy.stateTimer <= 0) {
                enemy.stateTimer = 2 + Math.random() * 3;
                enemy.patrolAngle = Math.random() * Math.PI * 2;
            }
            const moveSpeed = enemy.speed * 0.5 * dt;
            enemy.mesh.position.x += Math.cos(enemy.patrolAngle) * moveSpeed;
            enemy.mesh.position.z += Math.sin(enemy.patrolAngle) * moveSpeed;
            enemy.mesh.rotation.y = enemy.patrolAngle;
        }
    });
}

function updateCamera() {
    const targetX = playerMesh.position.x + Math.sin(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;
    const targetY = playerMesh.position.y + 2 + Math.sin(cameraAngleY) * cameraDistance;
    const targetZ = playerMesh.position.z + Math.cos(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;

    camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.1);
    camera.lookAt(playerMesh.position.x, playerMesh.position.y + 1.5, playerMesh.position.z);
}
</script>
