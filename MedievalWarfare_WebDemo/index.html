<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中世纪战争 - Medieval Warfare</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Georgia', 'Times New Roman', serif; background: #000; }
#gameCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

/* 主菜单 */
.menu-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, rgba(26,26,46,0.85) 0%, rgba(0,0,0,0.95) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
}
.menu-screen.hidden { display: none; }

.game-title {
    font-size: 72px; color: #c9a227;
    text-shadow: 0 0 30px rgba(201,162,39,0.5), 4px 4px 8px rgba(0,0,0,0.9), 0 0 60px rgba(201,162,39,0.2);
    margin-bottom: 10px; letter-spacing: 12px; font-weight: bold;
    font-family: 'Cinzel', Georgia, serif;
}
.game-subtitle {
    font-size: 20px; color: #8b7355; margin-bottom: 60px; letter-spacing: 8px;
}

.menu-btn {
    padding: 16px 70px; margin: 8px; min-width: 280px;
    font-size: 18px; font-family: inherit;
    background: linear-gradient(180deg, #4a3728 0%, #2d1f14 100%);
    color: #d4af37; border: 2px solid #8b7355; border-radius: 3px;
    cursor: pointer; transition: all 0.2s; letter-spacing: 3px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
}
.menu-btn:hover {
    background: linear-gradient(180deg, #5d4a3a 0%, #3d2a1d 100%);
    border-color: #d4af37; color: #f0d78c;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 20px rgba(212,175,55,0.2);
}

/* HUD */
.hud {
    position: fixed; top: 0; left: 0; width: 100%; padding: 20px;
    display: none; justify-content: space-between; align-items: flex-start;
    z-index: 50; pointer-events: none;
}
.hud.active { display: flex; }

.panel {
    background: linear-gradient(180deg, rgba(20,15,10,0.9) 0%, rgba(10,8,5,0.95) 100%);
    border: 2px solid #8b7355; border-radius: 3px;
    padding: 12px 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.health-panel { min-width: 280px; }
.health-label { color: #d4af37; font-size: 13px; margin-bottom: 6px; letter-spacing: 2px; }
.health-bar {
    width: 100%; height: 22px; background: #1a1a1a;
    border: 1px solid #5a4a3a; border-radius: 2px; overflow: hidden;
}
.health-fill {
    height: 100%;
    background: linear-gradient(180deg, #e74c3c 0%, #c0392b 50%, #a93226 100%);
    transition: width 0.3s;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}

.info-panel {
    color: #c9a227; font-size: 14px; letter-spacing: 1px; text-align: right;
}
.info-panel .big { font-size: 20px; color: #d4af37; font-weight: bold; }

/* 准星 */
.crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 24px; height: 24px; pointer-events: none; z-index: 40;
    display: none;
}
.crosshair.active { display: block; }
.crosshair-dot {
    position: absolute; top: 50%; left: 50%;
    width: 4px; height: 4px; background: rgba(255,255,255,0.8);
    transform: translate(-50%, -50%); border-radius: 50%;
}
.crosshair-line {
    position: absolute; background: rgba(255,255,255,0.6);
}
.crosshair-line.t { top: 0; left: 50%; width: 2px; height: 8px; transform: translateX(-50%); }
.crosshair-line.b { bottom: 0; left: 50%; width: 2px; height: 8px; transform: translateX(-50%); }
.crosshair-line.l { left: 0; top: 50%; width: 8px; height: 2px; transform: translateY(-50%); }
.crosshair-line.r { right: 0; top: 50%; width: 8px; height: 2px; transform: translateY(-50%); }

/* 提示 */
.hint-text {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); padding: 10px 30px; border-radius: 3px;
    color: #aaa; font-size: 13px; letter-spacing: 2px; z-index: 50;
    display: none; border: 1px solid #5a4a3a;
}
.hint-text.active { display: block; }

/* 交互提示 */
.interact-prompt {
    position: fixed; top: 60%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 3px;
    color: #d4af37; font-size: 15px; letter-spacing: 2px; z-index: 50;
    display: none; border: 1px solid #8b7355;
    animation: pulse 1.5s infinite;
}
.interact-prompt.active { display: block; }
.interact-prompt .key {
    display: inline-block; background: #d4af37; color: #1a1a1a;
    padding: 2px 10px; border-radius: 3px; font-weight: bold; margin-right: 8px;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

/* 结算界面 */
.result-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); display: none;
    flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
}
.result-screen.active { display: flex; }
.result-title { font-size: 64px; margin-bottom: 15px; letter-spacing: 10px; font-weight: bold; }
.result-title.victory { color: #d4af37; text-shadow: 0 0 30px rgba(212,175,55,0.5); }
.result-title.defeat { color: #c0392b; text-shadow: 0 0 30px rgba(192,57,43,0.5); }
.result-desc { color: #aaa; font-size: 18px; margin-bottom: 40px; letter-spacing: 2px; }

/* 加载 */
.loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0a0a; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    z-index: 200;
}
.loading-screen.active { display: flex; }
.loading-text { color: #d4af37; font-size: 24px; letter-spacing: 5px; margin-bottom: 20px; }
.loading-bar { width: 300px; height: 4px; background: #1a1a1a; border-radius: 2px; overflow: hidden; }
.loading-fill { height: 100%; width: 30%; background: #d4af37; animation: loading 1.5s infinite; }
@keyframes loading {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- 主菜单 -->
<div id="mainMenu" class="menu-screen">
    <h1 class="game-title">中世纪战争</h1>
    <p class="game-subtitle">MEDIEVAL&nbsp;&nbsp;WARFARE</p>
    <button class="menu-btn" onclick="startGame()">开 始 游 戏</button>
    <button class="menu-btn" onclick="showControls()">操 作 说 明</button>
</div>

<!-- 加载中 -->
<div id="loadingScreen" class="loading-screen">
    <div class="loading-text">加 载 中 . . .</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<!-- HUD -->
<div id="hud" class="hud">
    <div class="panel health-panel">
        <div class="health-label">生 命 值</div>
        <div class="health-bar"><div id="healthFill" class="health-fill" style="width:100%"></div></div>
    </div>
    <div id="infoPanel" class="panel info-panel">
        <div>大 地 图</div>
        <div class="big" id="enemyCountDisplay">探索世界</div>
    </div>
</div>

<!-- 准星 -->
<div id="crosshair" class="crosshair">
    <div class="crosshair-dot"></div>
    <div class="crosshair-line t"></div>
    <div class="crosshair-line b"></div>
    <div class="crosshair-line l"></div>
    <div class="crosshair-line r"></div>
</div>

<!-- 交互提示 -->
<div id="interactPrompt" class="interact-prompt">
    <span class="key">E</span>进入战斗
</div>

<!-- 提示 -->
<div id="hintText" class="hint-text">
    WASD 移动 · 鼠标 视角 · Shift 奔跑 · 空格 跳跃 · E 交互 · Esc 暂停
</div>

<!-- 结算 -->
<div id="resultScreen" class="result-screen">
    <div id="resultTitle" class="result-title victory">胜 利</div>
    <div id="resultDesc" class="result-desc">你击败了所有敌人</div>
    <button class="menu-btn" onclick="returnToMap()">返 回 大 地 图</button>
    <button class="menu-btn" onclick="returnToMenu()">返 回 主 菜 单</button>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
//  中世纪战争 - 全3D Web版
// ============================================================

const GameMode = { MENU: 'menu', WORLD_MAP: 'worldMap', BATTLE: 'battle' };
let currentMode = GameMode.MENU;

// ---- 全局 Three.js 对象 ----
let scene, camera, renderer, clock;
let playerGroup, playerBody, playerSword;
let keys = {};
let cameraYaw = 0, cameraPitch = 0.3;
let cameraDistance = 8;
let isPointerLocked = false;
let velocityY = 0;
let onGround = true;
let canJump = true;

// ---- 游戏数据 ----
const playerData = {
    maxHealth: 120,
    health: 120,
    attack: 25,
    defense: 8,
    speed: 6,
    isAttacking: false,
    attackTimer: 0,
    attackCooldown: 0,
    isBlocking: false
};

// ---- 世界地图数据 ----
const mapLocations = [
    { id: 'village', name: '起始村庄', type: 'village', pos: { x: 0, z: 0 }, enemies: 0, desc: '你的故乡，一个宁静的小村庄' },
    { id: 'forest', name: '黑暗森林', type: 'forest', pos: { x: -50, z: 40 }, enemies: 2, desc: '茂密的森林中潜伏着土匪' },
    { id: 'outpost', name: '边境哨站', type: 'castle', pos: { x: 60, z: 30 }, enemies: 3, desc: '废弃的哨站，被强盗占据' },
    { id: 'ruins', name: '古老遗迹', type: 'ruins', pos: { x: -30, z: -60 }, enemies: 3, desc: '神秘的古代遗迹' },
    { id: 'bandit', name: '强盗营地', type: 'camp', pos: { x: 40, z: -50 }, enemies: 4, desc: '强盗的主要据点' },
    { id: 'castle', name: '领主城堡', type: 'castle', pos: { x: 80, z: -80 }, enemies: 5, desc: '邪恶领主的城堡，最终目标', isBoss: true }
];
let currentLocation = null;
let nearbyLocation = null;

// ---- 战斗数据 ----
let enemies = [];
let battleActive = false;

// ============================================================
//  初始化
// ============================================================
function init() {
    const canvas = document.getElementById('gameCanvas');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);

    clock = new THREE.Clock();

    // 创建玩家
    createPlayer();

    // 事件
    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'KeyE') handleInteract();
        if (e.code === 'Space') tryJump();
    });
    window.addEventListener('keyup', e => {
        keys[e.code] = false;
        if (e.code === 'KeyE') {}
    });
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('resize', onResize);
    document.addEventListener('pointerlockchange', () => {
        isPointerLocked = document.pointerLockElement === canvas;
        if (!isPointerLocked && currentMode !== GameMode.MENU) {
            // 解锁时什么也不做，点回去就行
        }
    });

    canvas.addEventListener('click', () => {
        if (currentMode !== GameMode.MENU) {
            canvas.requestPointerLock();
        }
    });

    // 初始场景（菜单背景）
    createMenuScene();

    animate();
}

// ============================================================
//  玩家模型
// ============================================================
function createPlayer() {
    playerGroup = new THREE.Group();

    // 身体
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x3d5c5c });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.9, 4, 8), bodyMat);
    body.position.y = 0.8;
    body.castShadow = true;
    body.receiveShadow = true;
    playerGroup.add(body);
    playerBody = body;

    // 头
    const headMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), headMat);
    head.position.y = 1.65;
    head.castShadow = true;
    playerGroup.add(head);

    // 头盔
    const helmetMat = new THREE.MeshStandardMaterial({ color: 0x708090, metalness: 0.7, roughness: 0.4 });
    const helmet = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 12, 10, 0, Math.PI * 2, 0, Math.PI / 2),
        helmetMat
    );
    helmet.position.y = 1.65;
    helmet.castShadow = true;
    playerGroup.add(helmet);

    // 剑
    playerSword = new THREE.Group();
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.9, roughness: 0.2 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.0, 0.03), bladeMat);
    blade.position.y = 0.5;
    blade.castShadow = true;
    playerSword.add(blade);
    const guard = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.05), bladeMat);
    guard.position.y = 0;
    guard.castShadow = true;
    playerSword.add(guard);
    const hiltMat = new THREE.MeshLambertMaterial({ color: 0x654321 });
    const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.2, 8), hiltMat);
    hilt.position.y = -0.12;
    hilt.castShadow = true;
    playerSword.add(hilt);
    playerSword.position.set(0.45, 1.0, 0.15);
    playerSword.rotation.z = -0.4;
    playerGroup.add(playerSword);

    // 盾
    const shield = new THREE.Group();
    const shieldMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
    const shieldMesh = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.7, 0.06), shieldMat);
    shieldMesh.castShadow = true;
    shield.add(shieldMesh);
    const bossMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2 });
    const boss = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.02, 16), bossMat);
    boss.rotation.x = Math.PI / 2;
    boss.position.z = 0.04;
    shield.add(boss);
    shield.position.set(-0.45, 1.0, 0.15);
    shield.rotation.y = 0.4;
    playerGroup.add(shield);

    playerGroup.position.set(0, 0, 0);
}

// ============================================================
//  菜单场景
// ============================================================
let menuSceneObjects = [];

function createMenuScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a15);
    scene.fog = new THREE.Fog(0x0a0a15, 20, 80);

    // 光照
    const ambient = new THREE.AmbientLight(0x404060, 0.5);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffd700, 0.8);
    dir.position.set(10, 20, 5);
    dir.castShadow = true;
    scene.add(dir);
    const rim = new THREE.PointLight(0xc9a227, 1, 30);
    rim.position.set(-5, 5, 5);
    scene.add(rim);

    // 地面
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshLambertMaterial({ color: 0x1a1a2e })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 展示玩家模型
    const displayPlayer = playerGroup.clone();
    displayPlayer.position.set(0, 0, 0);
    displayPlayer.scale.set(1.5, 1.5, 1.5);
    scene.add(displayPlayer);
    menuSceneObjects.push(displayPlayer);

    // 远景装饰
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const dist = 25 + Math.random() * 10;
        const pillar = new THREE.Mesh(
            new THREE.CylinderGeometry(0.8, 1, 12, 6),
            new THREE.MeshLambertMaterial({ color: 0x2a2a4a })
        );
        pillar.position.set(Math.cos(angle) * dist, 6, Math.sin(angle) * dist);
        scene.add(pillar);
        menuSceneObjects.push(pillar);
    }

    // 粒子
    const particlesGeo = new THREE.BufferGeometry();
    const particleCount = 200;
    const pos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
        pos[i*3] = (Math.random() - 0.5) * 60;
        pos[i*3+1] = Math.random() * 20;
        pos[i*3+2] = (Math.random() - 0.5) * 60;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const particlesMat = new THREE.PointsMaterial({ color: 0xd4af37, size: 0.1, transparent: true, opacity: 0.6 });
    const particles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particles);
    menuSceneObjects.push(particles);
}

// ============================================================
//  世界地图（3D）
// ============================================================
let worldMapObjects = [];
let locationObjects = [];

function createWorldMap() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 80, 250);

    // 光照
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(50, 80, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -120;
    sun.shadow.camera.right = 120;
    sun.shadow.camera.top = 120;
    sun.shadow.camera.bottom = -120;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 200;
    scene.add(sun);

    // 地形（起伏地面）
    const terrainSize = 300;
    const terrainSeg = 80;
    const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSeg, terrainSeg);
    terrainGeo.rotateX(-Math.PI / 2);

    const posAttr = terrainGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const z = posAttr.getZ(i);
        let y = 0;
        y += Math.sin(x * 0.03) * Math.cos(z * 0.03) * 2;
        y += Math.sin(x * 0.01 + 1) * Math.cos(z * 0.015) * 4;
        y += Math.sin(x * 0.08 + z * 0.06) * 0.5;
        posAttr.setY(i, y);
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshLambertMaterial({ color: 0x4a7c3a });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);
    worldMapObjects.push(terrain);

    // 河流
    const riverGeo = new THREE.PlaneGeometry(8, 200);
    const riverMat = new THREE.MeshLambertMaterial({ color: 0x4a90d9, transparent: true, opacity: 0.8 });
    const river = new THREE.Mesh(riverGeo, riverMat);
    river.rotation.x = -Math.PI / 2;
    river.position.set(30, 0.05, 0);
    scene.add(river);
    worldMapObjects.push(river);

    // 各地点建筑
    mapLocations.forEach(loc => {
        const locGroup = createLocation(loc);
        locGroup.position.set(loc.pos.x, 0, loc.pos.z);
        scene.add(locGroup);
        locationObjects.push({ loc, obj: locGroup });
        worldMapObjects.push(locGroup);
    });

    // 森林
    createForest(-60, 50, 40, 30);
    createForest(70, -70, 25, 20);
    createForest(-40, -80, 30, 25);

    // 小山
    createHill(80, 50, 15, 8);
    createHill(-80, -30, 12, 6);
    createHill(0, 80, 10, 5);

    // 道路系统
    createRoads();

    // 放置玩家
    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);
    worldMapObjects.push(playerGroup);

    camera.position.set(0, 6, 8);
}

function createLocation(loc) {
    const g = new THREE.Group();

    if (loc.type === 'village') {
        // 村庄
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const r = 8 + Math.random() * 4;
            const house = createHouse(0xdeb887, 0x8b4513);
            house.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
            house.rotation.y = Math.random() * Math.PI * 2;
            g.add(house);
        }
        // 水井
        const well = new THREE.Mesh(
            new THREE.CylinderGeometry(0.8, 1, 1, 8),
            new THREE.MeshLambertMaterial({ color: 0x808080 })
        );
        well.position.y = 0.5;
        well.castShadow = true;
        g.add(well);
    } else if (loc.type === 'castle') {
        // 城堡
        const castle = createCastle();
        g.add(castle);
    } else if (loc.type === 'forest') {
        // 森林营地
        createForestLocal(0, 0, 25, 20, g);
        const tent = createTent();
        tent.position.set(0, 0, 0);
        g.add(tent);
        const tent2 = createTent();
        tent2.position.set(5, 0, 3);
        tent2.rotation.y = 0.5;
        g.add(tent2);
    } else if (loc.type === 'ruins') {
        // 遗迹
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const r = 8;
            const pillar = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.8, 8, 6),
                new THREE.MeshLambertMaterial({ color: 0xa0a0a0 })
            );
            pillar.position.set(Math.cos(angle) * r, 4, Math.sin(angle) * r);
            pillar.castShadow = true;
            if (Math.random() > 0.5) pillar.rotation.z = (Math.random() - 0.5) * 0.3;
            g.add(pillar);
        }
        // 废墟堆
        const rubble = new THREE.Mesh(
            new THREE.DodecahedronGeometry(2, 0),
            new THREE.MeshLambertMaterial({ color: 0x808080 })
        );
        rubble.position.y = 1;
        rubble.scale.y = 0.5;
        rubble.castShadow = true;
        g.add(rubble);
    } else if (loc.type === 'camp') {
        // 强盗营地
        for (let i = 0; i < 4; i++) {
            const angle = (i / 4) * Math.PI * 2;
            const r = 6;
            const tent = createTent();
            tent.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
            tent.rotation.y = -angle + Math.PI;
            g.add(tent);
        }
        // 营火
        const firePit = new THREE.Mesh(
            new THREE.CylinderGeometry(1, 1.2, 0.3, 8),
            new THREE.MeshLambertMaterial({ color: 0x404040 })
        );
        firePit.position.y = 0.15;
        g.add(firePit);
        const fireLight = new THREE.PointLight(0xff6600, 1, 10);
        fireLight.position.y = 1.5;
        g.add(fireLight);
    }

    // 地点标识（发光标记）
    const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 12, 8),
        new THREE.MeshBasicMaterial({ color: loc.enemies > 0 ? 0xff4444 : 0x44ff44, transparent: true, opacity: 0.8 })
    );
    marker.position.y = 8;
    g.add(marker);
    g.userData.marker = marker;
    g.userData.location = loc;

    return g;
}

function createRoads() {

    for (let i = 0; i < mapLocations.length - 1; i++) {

        const dx = b.pos.x - a.pos.x;
        const dz = b.pos.z - a.pos.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        const angle = Math.atan2(dx, dz);

        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(3, dist),

        );

let battleObjects = [];

function createBattleScene(location) {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 40, 120);

    // 光照
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(20, 40, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -40;
    sun.shadow.camera.right = 40;
    sun.shadow.camera.top = 40;
    sun.shadow.camera.bottom = -40;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 100;
    scene.add(sun);

    // 地面
    const groundGeo = new THREE.PlaneGeometry(100, 100, 20, 20);
    groundGeo.rotateX(-Math.PI / 2);
    const posAttr = groundGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const z = posAttr.getZ(i);
        const y = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 0.3;
        posAttr.setY(i, y);
    }
    groundGeo.computeVertexNormals();
    const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ color: 0x5a8a45 }));
    ground.receiveShadow = true;
    scene.add(ground);
    battleObjects.push(ground);

    // 环境装饰
    for (let i = 0; i < 15; i++) {
        const x = (Math.random() - 0.5) * 80;
        const z = (Math.random() - 0.5) * 80;
        if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;
        const type = Math.random();
        if (type < 0.6) {
            const rock = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.5 + Math.random() * 1, 0),
                new THREE.MeshLambertMaterial({ color: 0x707070 })
            );
            rock.position.set(x, 0.3, z);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.castShadow = true;
            scene.add(rock);
            battleObjects.push(rock);
        } else {
            const tree = createTree();
            tree.position.set(x, 0, z);
            tree.scale.setScalar(0.7 + Math.random() * 0.5);
            scene.add(tree);
            battleObjects.push(tree);
        }
    }

    // 废墟/围墙装饰（根据地点类型）
    if (location.type === 'castle' || location.type === 'ruins') {
        for (let i = 0; i < 5; i++) {
            const pillar = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.7, 4, 6),
                new THREE.MeshLambertMaterial({ color: 0x909090 })
            );
            const angle = (i / 5) * Math.PI * 2;
            const r = 25;
            pillar.position.set(Math.cos(angle) * r, 2, Math.sin(angle) * r);
            pillar.rotation.z = (Math.random() - 0.5) * 0.2;
            pillar.castShadow = true;
            scene.add(pillar);
            battleObjects.push(pillar);
        }
    }

    // 玩家
    playerGroup.position.set(0, 0, -15);
    scene.add(playerGroup);
    battleObjects.push(playerGroup);

    // 敌人
    enemies = [];
    const count = location.enemies || 3;
    for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const dist = 10 + Math.random() * 5;
        createEnemy(Math.cos(angle) * dist, Math.sin(angle) * dist);
    }

    battleActive = true;
    playerData.health = playerData.maxHealth;
    updateHealthUI();
    updateEnemyCountUI();
}

function createEnemy(x, z) {

    // 身体
    const body = new THREE.Mesh(

    // 头巾

        new THREE.MeshLambertMaterial({ color: 0x654321 })
    );
    hood.position.y = 1.5;
    hood.castShadow = true;
    g.add(hood);

    // 武器（斧头）
    const axe = new THREE.Group();
    const axeHandle = new THREE.Mesh(
        new THREE.CylinderGeometry(0.03, 0.03, 1, 6),

    );
    axeHandle.castShadow = true;
    axe.add(axeHandle);
    const axeHead = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.2, 0.05),

    axeHead.position.y = 0.4;
    axeHead.castShadow = true;
    axe.add(axeHead);
    axe.position.set(-0.4, 0.9, 0.1);
    axe.rotation.z = 0.3;
    g.add(axe);

    // 血条
    const hbBg = new THREE.Mesh(
        new THREE.PlaneGeometry(1.2, 0.12),
        new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide })
    );
    hbBg.position.y = 2.2;
    g.add(hbBg);
    const hb = new THREE.Mesh(
        new THREE.PlaneGeometry(1.2, 0.12),

    const enemy = {

//  更新
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    if (currentMode === GameMode.MENU) {
        // 菜单场景旋转展示
        if (menuSceneObjects[0]) {
            menuSceneObjects[0].rotation.y += dt * 0.5;
        }
        camera.position.set(0, 4, 8);
        camera.lookAt(0, 2, 0);
    } else if (currentMode === GameMode.WORLD_MAP) {
        updatePlayer(dt, 50);
        updateWorldMap(dt);
        updateCamera();
    } else if (currentMode === GameMode.BATTLE) {
        updatePlayer(dt, 25);
        updateBattle(dt);
        updateCamera();
    }

    renderer.render(scene, camera);
}

function updatePlayer(dt, boundary) {
    // 移动
    let speed = playerData.speed;
    if (keys['ShiftLeft'] || keys['ShiftRight']) speed *= 1.8;
    if (playerData.isBlocking) speed *= 0.5;

    const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
    const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

    let dx = 0, dz = 0;
    if (keys['KeyW'] || keys['ArrowUp']) { dx += forward.x; dz += forward.z; }
    if (keys['KeyS'] || keys['ArrowDown']) { dx -= forward.x; dz -= forward.z; }
    if (keys['KeyA'] || keys['ArrowLeft']) { dx -= right.x; dz -= right.z; }
    if (keys['KeyD'] || keys['ArrowRight']) { dx += right.x; dz += right.z; }

    const len = Math.sqrt(dx * dx + dz * dz);
    if (len > 0) {
        dx = dx / len * speed * dt;
        dz = dz / len * speed * dt;
        playerGroup.position.x += dx;
        playerGroup.position.z += dz;

        // 角色朝向
        const targetRot = Math.atan2(dx, dz);
        let diff = targetRot - playerGroup.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        playerGroup.rotation.y += diff * 0.15;
    }

    // 边界限制
    playerGroup.position.x = Math.max(-boundary, Math.min(boundary, playerGroup.position.x));
    playerGroup.position.z = Math.max(-boundary, Math.min(boundary, playerGroup.position.z));

    // 重力和跳跃
    velocityY -= 20 * dt;
    playerGroup.position.y += velocityY * dt;
    if (playerGroup.position.y <= 0) {
        playerGroup.position.y = 0;
        velocityY = 0;
        onGround = true;
    }

    // 攻击冷却
    if (playerData.attackCooldown > 0) playerData.attackCooldown -= dt;

    // 攻击动画
    if (playerData.attackTimer > 0) {
        playerData.attackTimer -= dt;
        const t = playerData.attackTimer / 0.35;
        playerSword.rotation.x = -Math.sin((1 - t) * Math.PI) * 2;
        if (playerData.attackTimer <= 0) {
            playerSword.rotation.x = 0;
            playerData.isAttacking = false;
        }
    }

    // 防御姿态
    if (playerData.isBlocking) {
        playerSword.position.set(0.3, 1.1, 0.3);
        playerSword.rotation.z = -0.8;
    } else {
        playerSword.position.set(0.45, 1.0, 0.15);
        playerSword.rotation.z = -0.4;
    }
}

function tryJump() {
    if (onGround && canJump && currentMode !== GameMode.MENU) {
        velocityY = 8;
        onGround = false;
    }
}

function updateWorldMap(dt) {
    // 检查附近地点
    nearbyLocation = null;
    let minDist = 12;

    locationObjects.forEach(({ loc, obj }) => {
        const dx = playerGroup.position.x - loc.pos.x;
        const dz = playerGroup.position.z - loc.pos.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        // 标记浮动动画
        if (obj.userData.marker) {
            obj.userData.marker.position.y = 8 + Math.sin(clock.elapsedTime * 2 + loc.pos.x) * 0.5;
            const baseColor = loc.enemies > 0 ? new THREE.Color(0xff4444) : new THREE.Color(0x44ff44);
            obj.userData.marker.material.color.copy(baseColor);
        }

        if (dist < minDist && loc.enemies > 0) {
            minDist = dist;
            nearbyLocation = loc;
        }
    });

    // 显示交互提示
    const prompt = document.getElementById('interactPrompt');
    if (nearbyLocation) {
        prompt.classList.add('active');
        prompt.innerHTML = `<span class="key">E</span>进入 ${nearbyLocation.name} 战斗`;
    } else {
        prompt.classList.remove('active');
    }
}

function handleInteract() {
    if (currentMode === GameMode.WORLD_MAP && nearbyLocation) {
        enterBattle(nearbyLocation);
    }
}

function updateBattle(dt) {
    if (!battleActive) return;

    let aliveCount = 0;

    enemies.forEach(enemy => {
        if (enemy.isDead) return;
        aliveCount++;

        // 血条朝相机
        if (enemy.healthBar) {
            enemy.healthBar.lookAt(camera.position);
            enemy.healthBar.parent.getObjectByName(enemy.healthBar.parent.children[0].geometry ? '' : '').lookAt(camera.position);
            // 简化：让整个血条组面向相机
            const hbBg = enemy.mesh.children.find(c => c.geometry && c.geometry.type === 'PlaneGeometry' && !c.position.z);
            if (hbBg) hbBg.lookAt(camera.position);
            enemy.healthBar.lookAt(camera.position);
        }

        // 受伤闪烁
        if (enemy.damageFlash > 0) {
            enemy.damageFlash -= dt;
        }

        // AI
        if (enemy.attackCooldown > 0) enemy.attackCooldown -= dt;

        const dx = playerGroup.position.x - enemy.mesh.position.x;
        const dz = playerGroup.position.z - enemy.mesh.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist < 2.2) {
            // 攻击
            enemy.mesh.rotation.y = Math.atan2(dx, dz);
            if (enemy.attackCooldown <= 0) {
                damagePlayer(enemy.attack);
                enemy.attackCooldown = 1.5;
            }
        } else if (dist < 30) {
            // 追击
            const moveSpeed = enemy.speed * dt;
            enemy.mesh.position.x += (dx / dist) * moveSpeed;
            enemy.mesh.position.z += (dz / dist) * moveSpeed;
            enemy.mesh.rotation.y = Math.atan2(dx, dz);
        } else {
            // 巡逻
            enemy.stateTimer -= dt;
            if (enemy.stateTimer <= 0) {
                enemy.stateTimer = 2 + Math.random() * 3;
                enemy.patrolAngle = Math.random() * Math.PI * 2;
            }
            const moveSpeed = enemy.speed * 0.4 * dt;
            enemy.mesh.position.x += Math.cos(enemy.patrolAngle) * moveSpeed;
            enemy.mesh.position.z += Math.sin(enemy.patrolAngle) * moveSpeed;
            enemy.mesh.rotation.y = enemy.patrolAngle;
        }
    });

    // 检查胜利
    if (aliveCount === 0 && battleActive) {
        setTimeout(() => showResult(true), 500);
        battleActive = false;
    }
}

function playerAttack() {
    if (playerData.attackCooldown > 0 || playerData.isAttacking) return;

    playerData.isAttacking = true;
    playerData.attackTimer = 0.35;
    playerData.attackCooldown = 0.7;

    // 攻击判定
    const attackRange = 2.8;
    const attackAngle = Math.PI / 3;
    const forward = new THREE.Vector3(
        Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y)
    );

    enemies.forEach(enemy => {
        if (enemy.isDead) return;
        const dx = enemy.mesh.position.x - playerGroup.position.x;
        const dz = enemy.mesh.position.z - playerGroup.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < attackRange) {
            const dir = new THREE.Vector3(dx, 0, dz).normalize();
            const dot = forward.dot(dir);
            if (dot > Math.cos(attackAngle / 2)) {
                dealDamageToEnemy(enemy, playerData.attack);
            }
        }
    });
}

function dealDamageToEnemy(enemy, damage) {
    enemy.health -= damage;
    enemy.damageFlash = 0.1;

    if (enemy.healthBar) {
        const ratio = Math.max(0, enemy.health / enemy.maxHealth);
        enemy.healthBar.scale.x = ratio;
        if (ratio < 0.3) {
            enemy.healthBar.material.color.setHex(0xff0000);
        } else if (ratio < 0.6) {
            enemy.healthBar.material.color.setHex(0xffa500);
        }
    }

    // 击退
    const dx = enemy.mesh.position.x - playerGroup.position.x;
    const dz = enemy.mesh.position.z - playerGroup.position.z;
    const len = Math.sqrt(dx * dx + dz * dz);
    if (len > 0) {
        enemy.mesh.position.x += (dx / len) * 0.5;
        enemy.mesh.position.z += (dz / len) * 0.5;
    }

    if (enemy.health <= 0) {
        enemy.isDead = true;
        scene.remove(enemy.mesh);
        updateEnemyCountUI();
    }
}

function damagePlayer(damage) {
    if (playerData.isBlocking) damage = Math.floor(damage * 0.3);
    playerData.health -= damage;
    if (playerData.health <= 0) {
        playerData.health = 0;
        setTimeout(() => showResult(false), 300);
    }
    updateHealthUI();
}

function updateHealthUI() {
    document.getElementById('healthFill').style.width =
        (playerData.health / playerData.maxHealth * 100) + '%';
}

function updateEnemyCountUI() {
    const alive = enemies.filter(e => !e.isDead).length;
    updateInfoPanel('战斗', `剩余敌人: ${alive}`);
}

function updateInfoPanel(title, desc) {
    const panel = document.getElementById('infoPanel');
    panel.innerHTML = `<div>${title}</div><div class="big">${desc}</div>`;
}

function updateCamera() {
    const targetX = playerGroup.position.x + Math.sin(cameraYaw) * Math.cos(cameraPitch) * cameraDistance;
    const targetY = playerGroup.position.y + 2 + Math.sin(cameraPitch) * cameraDistance;
    const targetZ = playerGroup.position.z + Math.cos(cameraYaw) * Math.cos(cameraPitch) * cameraDistance;

    camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.15);
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);
}

// ============================================================
//  输入
// ============================================================
function onMouseMove(e) {
    if (!isPointerLocked) return;
    cameraYaw -= e.movementX * 0.0025;
    cameraPitch -= e.movementY * 0.002;
    cameraPitch = Math.max(0.05, Math.min(Math.PI / 2.3, cameraPitch));
}

function onMouseDown(e) {
    if (currentMode !== GameMode.BATTLE) return;
    if (e.button === 0) {
        playerAttack();
    } else if (e.button === 2) {
        playerData.isBlocking = true;
    }
}

function onMouseUp(e) {
    if (e.button === 2) {
        playerData.isBlocking = false;
    }
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// 禁用右键菜单
document.addEventListener('contextmenu', e => e.preventDefault());

// 启动
window.addEventListener('load', init);
</script>
</body>
</html>
